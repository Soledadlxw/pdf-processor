# ── 医学书籍配置 ──
domain: "medical"
book_dir: "../books_medical"
output_dir: "Book Notes"
meta_file: "../metadata_medical.yaml"

# ── 模型 ──
extract_model: "gemma4:31b-mlx"
translate_model: "qwen3.6:35b-mlx"
http_timeout: 600
keep_alive: "5m"

# ── 预处理 ──
model_warmup: true

# ── Prompt ──
stage1_prompt: "../prompts/medical_stage1.txt"
stage2_prompt: "../prompts/medical_stage2.txt"

# ── 清洗 ──
header_y_ratio: 0.08
footer_y_ratio: 0.08
max_chars_per_chapter: 25000
child_chunk_size: 4000
max_retries: 3

# ── 参考文献 ──
keep_references: false
trim_references: true

# ── 表格 ──
table_extraction: true
render_charts: false
gen_image_desc: false
image_dpi: 200

# ── 结构化数据 ──
structured_data: false
gen_mermaid: false

# ── Metadata 字段 ──
metadata_fields:
  cite_key:        { required: true }
  title:           { required: true }
  title_zh:        { required: true }
  authors:         { required: true }
  edition:         { required: false }
  year:            { required: true }
  publisher:       { required: false }
  isbn:            { required: false }
  dsm_version:     { required: false }
  evidence_level:  { required: false }
  book_type:       { required: true }

# ── 时效性规则 ──
timeliness_rules:
  - check: "dsm_version and 'DSM-5-TR' not in str(dsm_version) and 'DSM-5' not in str(dsm_version)"
    warning_zh: "⚠️ 本书基于 {dsm_version}，DSM-5-TR 已于 2022 年发布"
  - check: "year and CURRENT_YEAR - int(year) > 10"
    warning_zh: "📅 本书出版于 {year} 年，内容年龄 {age} 年"
  - check: "year and CURRENT_YEAR - int(year) > 10 and tags and any('intervention' in str(t) for t in tags)"
    warning_zh: "🔬 干预领域进展较快，建议查阅近 5 年系统综述"

# ── 后处理 ──
postprocess_module: "postprocess.medical"
incremental_index: true
attachments_dir: "_attachments"

# ── Obsidian ──
obsidian_breadcrumb: true
obsidian_aliases: true
